version: 1
allow_unmeasured: false    # field testing: refuse to start with a null required value.  true = dev mode (placeholders, logged loudly)

# ---- §12.3 unmeasured-parameters register: every placeholder carries a tag ----------------------
register:
  frame_duration_s:        { tag: measured,    filled_by: "tools/kld7_probe.py --all-rspi, 2026-09-14: 228.3 / 114.2 / 57.0 / 28.76 ms" }
  sensor_delay_s:          { tag: measured,    filled_by: "tools/kld7_probe.py --random-phase, 2026-09-14: 8.7 ms (three estimators within 0.8 ms)", required: true }
  usb_latency_s:           { tag: unvalidated, filled_by: "tools/kld7_probe.py" }
  doppler_blind_band_mps:  { tag: unvalidated, filled_by: "bench: reflector at controlled speeds (one bin = 0.217 m/s at RSPI 3)" }
  pdat_cap:                { tag: nominal,     filled_by: "tools/kld7_probe.py confirms 12" }
  kld7_firmware_version:   { tag: measured,    filled_by: "K-LD7_APP-RFB-0105 read 2026-09-14; recorded in every session header" }
  threat_thresholds:       { tag: unvalidated, filled_by: "simulator tuning, then rides" }
  alias_check_c_alias_db:  { tag: unvalidated, filled_by: "tools/kld7_probe.py magnitude-vs-range log with a known reflector" }
  consistency_check:       { tag: unvalidated, filled_by: "rides: confirm wheel micro-Doppler appears in PDAT as modelled" }
  policy_thresholds:       { tag: unvalidated, filled_by: "simulator tuning, then rides" }
  blockage_thresholds:     { tag: unvalidated, filled_by: "simulator open-road false-alarm rate, then rides" }
  haptic_watchdog_timing:  { tag: unvalidated, filled_by: "docs/haptics.md proposal (the MCU ICD's 250 ms); bench with kill -STOP" }
  haptic_pins:             { tag: nominal,     filled_by: "wiring; confirm side by side with tools/haptics_test.py" }
  haptic_patterns:         { tag: unvalidated, filled_by: "on-body test while riding: tools/haptics_test.py --patterns" }
  imu_report_rates:        { tag: measured,    filled_by: "tools/bno085_probe.py 2026-09-14: gyro 197.5 Hz (jitter p99 1.3 ms), accel 126 Hz (100 requested)" }
  T_radar_imu:             { tag: nominal,     filled_by: "mechanical, then six-orientation static test" }
  eskf_noise:              { tag: unvalidated, filled_by: "static log with tools/bno085_probe.py" }
  cap_truncation_policy:   { tag: unvalidated, filled_by: "team / RFbeam; left configurable for testing (sim.radar.cap_policy)" }

radar_health:
  gap_window_s: 1.0
  gap_fraction_degraded: 0.2

imu:
  gyro_rate_hz: 200                  # proposal (unvalidated): tools/bno085_probe.py measures the achieved rate
  accel_rate_hz: 100
  spi_baudrate: 1000000
  pins: { cs: D5, int: D25, reset: D24 }     # Blinka pin names; not D8: with dtparam=spi=on the kernel owns GPIO8 as spi0 CS0. Confirm wiring at bring-up
  log_game_rotation_vector: false    # diagnostic only; never fused
  no_data_timeout_s: 0.1
  stale_after_s: 0.25
  eskf:
    gyro_noise_rad_s: 0.004          # per-sample white noise density proxy (rad/s/sqrt(Hz))
    gyro_bias_rw_rad_s2: 0.0002
    accel_dir_noise_rad: 0.08
    accel_norm_gate_mps2: 0.5        # coordinated-turn degeneracy gate
    gyro_rate_gate_rad_s: 0.35
    gated_long_s: 5.0
    centripetal_compensation: false  # uses PREVIOUS cycle ego velocity when true
    init_sigma_att_rad: 0.3
    init_sigma_bias_rad_s: 0.02
    buffer_s: 2.0
  motion:
    window_s: 1.0
    accel_std_thresh_mps2: 0.15
    gyro_std_thresh_rad_s: 0.02

ego:
  ransac_iterations: 80
  inlier_thresh_mps: 0.35            # ~1.5 speed bins at RSPI 3
  min_inliers: 3
  min_az_spread_rad: 0.26            # 15 deg
  max_rms_mps: 0.3
  top_of_band_tolerance: 0.25        # fitted speed vs max receding v_radial; MERGED_BINS_SUSPECTED beyond
  prior_speed_gate_mps: 2.5
  candidate_min_receding_mps: 0.3
  stopped_speed_mps: 0.5

clutter:
  doppler_blind_band_mps: 0.5        # PLACEHOLDER (unvalidated)
  stationary_resid_mps: 0.5
  pass_receding_movers: true         # design decision left configurable (plan §4.6)
  saturation_window_s: 1.0
  saturation_fraction: 0.5
  phantom_filter:                    # a return with |r_dot| > min_rdot that stays in the same range cell is not a moving object (wheel micro-Doppler)
    enabled: true
    window_frames: 12                # ~0.35 s at RSPI 3
    min_hits: 8
    min_rdot_mps: 3.0                # a 3 m/s closer leaves a 1 m cell within the window
    cell_r_m: 1.0
    cell_rdot_mps: 2.0
  alias_check:                       # range-aliased returns (beyond RRAI range) are far too weak for their apparent range
    enabled: false                   # OFF since 2026-09-14: on the real K-LD7 it rejected 81 % of approaching targets within 5 m (median 52 dB).
                                     # Replaying that bench session: 0 warnings with it on, 7 episodes (up to ALERT) with it off.
                                     # Re-enable after recalibrating c_alias_db with a reflector (UNVERIFIED R21/R22).
    c_alias_db: 63.0                 # reject if magnitude_db < c_alias - 40 log10(r).  UNVALIDATED: simulator magnitude scale; recalibrate from probe magnitude-vs-range data

tracker:
  cluster_dr_m: 2.0
  cluster_drdot_mps: 1.5
  cluster_daz_rad: 0.14
  gate_chi2: 11.34                   # chi-square 3 dof, 99 %
  sigma_r_meas_m: 0.25               # 30 cm bins
  sigma_rdot_meas_mps: 0.25          # ~1 bin
  sigma_az_meas_rad: 0.035           # 1 deg quantisation + phase noise (2 deg)
  q_accel_mps2: 1.5                  # sqrt of the acceleration spectral density (continuous white-noise-acceleration model)
  q_az_rate_rad_s: 0.3               # azimuth random-walk density; passing cars sweep azimuth quickly
  az_var_floor_factor: 1.0           # azimuth variance never below (sigma_az_meas^2 * factor): keeps the gain >= 0.5 for sweeping targets
  init_sigma_rdot_mps: 1.0
  init_sigma_az_rad: 0.06
  confirm_approaching: [3, 4]        # M of N
  confirm_other: [4, 6]
  tentative_max_misses: 2
  fov_exit_margin_rad: 0.10
  doppler_blind_margin_mps: 0.3
  coast_sigma_r_bound_m: 6.0
  coast_unexplained_q_accel_mps2: 8.0
  fov_pass_hold_s: 1.0
  max_tracks: 24
  consistency_min_samples: 6         # range trend vs range-rate check (wheel micro-Doppler phantoms); no threat before it has run once
  consistency_tol_mps: 2.5           # ~2.5 sigma of the LS slope noise with 30 cm range bins over 0.3 s
  consistency_tol_frac: 0.3
  consistency_strikes: 3
  reacquire_dr_m: 3.0                # absolute gates for re-acquiring a coasting track (its covariance is inflated by design)
  reacquire_drdot_mps: 3.0

threat:
  k_sigma: 2.0
  t_alert_s: 1.5                     # unvalidated
  t_warning_s: 3.0
  t_advisory_s: 6.0
  r_close_m: 4.0                     # proximity rule: approaching and r < r_close -> at least WARNING
  proximity_level: 2
  side_center_halfwidth_m: 1.0
  side_yaw_sigma_rad: 0.2618         # 15 deg torso-yaw floor (§7)
  confidence_r_max_m: 30.0
  coasting_confidence_factor: 0.5
  unexplained_coast_holds_level: true   # design decision left configurable (plan §4.8)

policy:
  dwell_s: 1.0
  hysteresis_factor: 1.3
  min_on_time_s: 0.7
  min_on_level: 2
  alert_level: 3                     # the only level that asserts the alert channel; never for faults

blockage:
  enabled: true
  min_silent_s: 5.0                  # in motion, ~no raw targets and no ego inliers for this long -> RADAR_POSSIBLY_BLOCKED (advisory)
  max_mean_targets_per_frame: 0.15   # tolerated noise false alarms while blocked

haptics:
  # Vibration motors on Pi GPIOs, each through its driver's PWM input (team decision 2026-10-07: no MCU).
  # pin: Blinka board name (D12 = BCM GPIO12).  side: LEFT or RIGHT; CENTER and BOTH threats use every motor.
  # Check the wiring with tools/haptics_test.py before riding (docs/haptics.md).
  motors:
    - { name: left,  pin: D12, side: LEFT }
    - { name: right, pin: D13, side: RIGHT }
  pwm_duty_cycle: 1.0                # team decision 2026-10-07: 100 %.  A motor is fully on or off; patterns are timing only
  pwm_frequency_hz: 1000             # lgpio software PWM; at 100 % the line is simply held high
  render_period_s: 0.005             # pattern resolution; the render thread also wakes on every hand-over
  stall_timeout_s: 0.25              # pipeline loop counter not advancing (or no heartbeat) -> FALLBACK, "warnings offline"
  reopen_backoff_s: [0.5, 1.0, 2.0]  # after a GPIO error (HAPTICS_FAULT)
  patterns:                          # count pulses of pulse_s, gap_s apart, every period_s.  UNVALIDATED: on-body test
    advisory: { pulse_s: 0.15, gap_s: 0.0,  count: 1, period_s: 2.0 }    # level 1, threat side
    warning:  { pulse_s: 0.15, gap_s: 0.1,  count: 2, period_s: 1.0 }    # level 2, threat side
    alert:    { pulse_s: 0.25, gap_s: 0.0,  count: 1, period_s: 0.3 }    # level 3 (alert channel) only, threat side: near continuous
    degraded: { pulse_s: 0.05, gap_s: 0.0,  count: 1, period_s: 10.0 }   # every motor while DEGRADED, on top of any threat
    offline:  { pulse_s: 0.05, gap_s: 0.15, count: 3, period_s: 5.0 }    # "warnings offline", every motor; never a threat pattern

orchestrator:
  tick_timeout_s: 0.05               # health-only loop tick when no radar frame arrives
  watchdog_notify_min_period_s: 0.5
  latency_report_period_s: 10.0
  gc_freeze: true

power:
  poll_period_s: 1.0

recording:
  enabled: true
  dir: /home/ted/golden_fleece_recordings      # root card (team decision); writer thread + bounded queue never blocks the loop
  queue_depth: 4096
  flush_period_s: 0.2                # the field web app follows this file; flush often so it lags little
  cmd_refresh_s: 0.2                 # a decision is recorded when it changes, and at least this often
  haptics_refresh_s: 5.0             # what the motors render is recorded on every change, and at least this often
